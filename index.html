<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Границы Бахчисарайское 2 и 3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif}
#map{background:#eee}
.info {
  position:absolute; z-index:1000; left:10px; bottom:16px;
  background:rgba(255,255,255,.94); padding:9px 11px; border-radius:8px;
  box-shadow:0 1px 5px rgba(0,0,0,.25); font-size:13px; max-width:310px;
}
.locate {
  position:absolute; z-index:1000; right:10px; top:82px;
  width:44px; height:44px; border:0; border-radius:8px; background:white;
  box-shadow:0 1px 5px rgba(0,0,0,.3); font-size:24px; cursor:pointer;
}
.locate.active{background:#e8f3ff}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;background:#eee;margin-top:4px}

.add-point {
  position:absolute; z-index:1000; right:10px; top:136px;
  width:44px; height:44px; border:0; border-radius:8px; background:white;
  box-shadow:0 1px 5px rgba(0,0,0,.3); font-size:25px; cursor:pointer;
}
.add-point.active{background:#fff0c2}
.points-toggle {
  position:absolute; z-index:1000; right:10px; top:190px;
  width:44px; height:44px; border:0; border-radius:8px; background:white;
  box-shadow:0 1px 5px rgba(0,0,0,.3); font-size:21px; cursor:pointer;
}
.points-panel {
  position:absolute; z-index:1100; right:64px; top:82px;
  width:min(330px, calc(100vw - 84px)); max-height:60vh; overflow:auto;
  background:rgba(255,255,255,.97); border-radius:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.28); padding:10px; display:none;
}
.points-panel.open{display:block}
.points-panel h3{font-size:15px;margin:0 0 8px}
.points-status{font-size:12px;color:#555;margin:4px 0 8px}
.point-row{
  display:flex; align-items:center; gap:6px; padding:7px 5px;
  border-top:1px solid #e7e7e7; font-size:13px;
}
.point-name{flex:1;cursor:pointer;word-break:break-word}
.point-action{
  border:0;background:#f2f2f2;border-radius:6px;padding:5px 7px;cursor:pointer;
}
.cloud-marker-label{
  background:#fff;border:1px solid #999;border-radius:4px;padding:1px 4px;
  box-shadow:none;font-size:11px
}
@media (max-width: 600px){
  .info{max-width:250px;font-size:12px}
  .points-panel{right:60px;top:70px;max-height:52vh}
}
</style>
</head>

<div id="map"></div>
<button id="locateBtn" class="locate" title="Показать моё местоположение">◎</button>

}).addTo(map);

function styleFeature(feature) {
  if (feature.properties.name === 'Бахчисарайское 2')
    return {color:'#b00020', weight:3, fillColor:'#ff6b6b', fillOpacity:.13};
  if (feature.properties.name === 'Бахчисарайское 3')
    return {color:'#005bbb', weight:3, fillColor:'#67a8ff', fillOpacity:.13};
  return {color:'#7a3db8', weight:2};
}

  filter: f => f.geometry.type === 'Polygon',
  style: styleFeature,
  onEachFeature: (f,l) => l.bindPopup('<b>'+f.properties.name+'</b>')
}).addTo(map);

  filter: f => f.geometry.type === 'Point',
  pointToLayer: (f,latlng) => L.circleMarker(latlng, {

  }),
  onEachFeature: (f,l) => l.bindPopup(
    '<b>'+f.properties.name+'</b><br>'+f.properties.note
  )
}).addTo(map);

function makePointLayer(arr, title) {
  const group = L.layerGroup();
  arr.forEach(p => {
    L.circleMarker([p.lat,p.lon], {
      radius:2.2, color:'#222', weight:1, fillOpacity:.65
    }).bindPopup(
      '<b>'+title+'</b><br>Точка №'+p.n+
      '<br>'+p.lat.toFixed(6)+', '+p.lon.toFixed(6)
    ).addTo(group);
  });
  return group;
}

// ===== Облачные точки (Supabase) =====
const SUPABASE_URL = 'https://dpqayaybdqugmogmmfww.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cBKFBTYqJTjmoTgnxX0UpQ_AzvTFIwz';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const addPointBtn = document.getElementById('addPointBtn');
const pointsToggleBtn = document.getElementById('pointsToggleBtn');
const pointsPanel = document.getElementById('pointsPanel');
const pointsStatus = document.getElementById('pointsStatus');
const pointsList = document.getElementById('pointsList');

let addPointMode = false;
let cloudPoints = [];
const cloudMarkers = new Map();

function esc(s) {
  return String(s ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

function setPointsStatus(text) {
  pointsStatus.textContent = text;
}

function markerPopup(p) {
  return `
    <b>${esc(p.name)}</b><br>
    ${Number(p.latitude).toFixed(6)}, ${Number(p.longitude).toFixed(6)}<br>
    <div style="margin-top:7px;display:flex;gap:6px">
      <button onclick="renameCloudPoint(${Number(p.id)})">Переименовать</button>
      <button onclick="deleteCloudPoint(${Number(p.id)})">Удалить</button>
    </div>`;
}

function drawCloudPoints() {
  cloudPointsLayer.clearLayers();
  cloudMarkers.clear();

  cloudPoints.forEach(p => {
    const marker = L.marker([p.latitude, p.longitude])
      .bindPopup(markerPopup(p))
      .bindTooltip(p.name, {direction:'top', offset:[0,-10], className:'cloud-marker-label'});
    marker.addTo(cloudPointsLayer);
    cloudMarkers.set(Number(p.id), marker);
  });

  renderPointsList();
}

function renderPointsList() {
  if (!cloudPoints.length) {
    pointsList.innerHTML = '<div style="font-size:13px;color:#666">Пока нет сохранённых точек.</div>';
    return;
  }

  pointsList.innerHTML = cloudPoints.map(p => `
    <div class="point-row">
      <div class="point-name" onclick="goToCloudPoint(${Number(p.id)})">${esc(p.name)}</div>
      <button class="point-action" title="Переименовать" onclick="renameCloudPoint(${Number(p.id)})">✎</button>
      <button class="point-action" title="Удалить" onclick="deleteCloudPoint(${Number(p.id)})">×</button>
    </div>
  `).join('');
}

async function loadCloudPoints() {
  setPointsStatus('Загрузка из Supabase…');
  const { data, error } = await db
    .from('map_points')
    .select('id,name,latitude,longitude,created_at')
    .order('created_at', {ascending:true});

  if (error) {
    console.error(error);
    setPointsStatus('Ошибка Supabase: ' + error.message);
    return;
  }

  cloudPoints = data || [];
  drawCloudPoints();
  setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);
}

async function saveCloudPoint(lat, lon, name) {
  setPointsStatus('Сохраняю…');
  const { data, error } = await db
    .from('map_points')
    .insert({name, latitude:lat, longitude:lon})
    .select('id,name,latitude,longitude,created_at')
    .single();

  if (error) {
    console.error(error);
    alert('Не удалось сохранить точку: ' + error.message);
    setPointsStatus('Ошибка сохранения');
    return;
  }

  cloudPoints.push(data);
  drawCloudPoints();
  setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);

  const marker = cloudMarkers.get(Number(data.id));
  if (marker) marker.openPopup();
}

window.goToCloudPoint = function(id) {
  const p = cloudPoints.find(x => Number(x.id) === Number(id));
  const marker = cloudMarkers.get(Number(id));
  if (!p) return;
  map.setView([p.latitude, p.longitude], Math.max(map.getZoom(), 17));
  pointsPanel.classList.remove('open');
  if (marker) marker.openPopup();
};

window.renameCloudPoint = async function(id) {
  const p = cloudPoints.find(x => Number(x.id) === Number(id));
  if (!p) return;

  const newName = prompt('Новое название точки:', p.name);
  if (newName === null) return;
  const name = newName.trim();
  if (!name) return;

  const { error } = await db.from('map_points').update({name}).eq('id', id);
  if (error) {
    alert('Не удалось переименовать точку: ' + error.message);
    return;
  }

  p.name = name;
  drawCloudPoints();
  setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);
};

window.deleteCloudPoint = async function(id) {
  const p = cloudPoints.find(x => Number(x.id) === Number(id));
  if (!p) return;
  if (!confirm(`Удалить точку «${p.name}»?`)) return;

  const { error } = await db.from('map_points').delete().eq('id', id);
  if (error) {
    alert('Не удалось удалить точку: ' + error.message);
    return;
  }

  cloudPoints = cloudPoints.filter(x => Number(x.id) !== Number(id));
  drawCloudPoints();
  setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);
};

addPointBtn.addEventListener('click', () => {
  addPointMode = !addPointMode;
  addPointBtn.classList.toggle('active', addPointMode);
  addPointBtn.title = addPointMode ? 'Отменить добавление точки' : 'Добавить свою точку';
  if (addPointMode) {
    setPointsStatus('Режим добавления: нажмите нужное место на карте.');
    pointsPanel.classList.add('open');
  } else {
    setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);
  }
});

pointsToggleBtn.addEventListener('click', () => {
  pointsPanel.classList.toggle('open');
});

map.on('click', async (e) => {
  if (!addPointMode) return;

  addPointMode = false;
  addPointBtn.classList.remove('active');

  const nameRaw = prompt('Название точки:');
  if (nameRaw === null) {
    setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);
    return;
  }

  const name = nameRaw.trim();
  if (!name) {
    alert('Название не может быть пустым.');
    setPointsStatus(`Сохранено точек: ${cloudPoints.length}`);
    return;
  }

  await saveCloudPoint(e.latlng.lat, e.latlng.lng, name);
});

// Загружаем сохранённые точки при каждом открытии карты.
loadCloudPoints();

let gpsMarker = null;
let accuracyCircle = null;
let watchId = null;
let firstFix = true;
const btn = document.getElementById('locateBtn');
const gpsText = document.getElementById('gpsText');

function insideText(lon,lat) {
  const pt = turf.point([lon,lat]);
  const found = [];
  geojson.features.filter(f => f.geometry.type === 'Polygon').forEach(f => {
    if (turf.booleanPointInPolygon(pt,f)) found.push(f.properties.name);
  });
  return found.length ? 'Вы внутри: '+found.join(', ') : 'Вы вне выделенных территорий';
}

function nearestBoundaryDistance(lon,lat) {
  const pt = turf.point([lon,lat]);
  let min = Infinity;
  geojson.features.filter(f => f.geometry.type === 'Polygon').forEach(f => {
    f.geometry.coordinates.forEach(ring => {
      const line = turf.lineString(ring);
      const d = turf.pointToLineDistance(pt,line,{units:'meters'});
      if (d < min) min = d;
    });
  });
  return min;
}

function onLocation(pos) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const acc = pos.coords.accuracy || 0;

  if (!gpsMarker) {
    gpsMarker = L.circleMarker([lat,lon], {
      radius:8, color:'#005eff', weight:3, fillColor:'#fff', fillOpacity:1
    }).addTo(map).bindPopup('Ваше местоположение');
    accuracyCircle = L.circle([lat,lon], {
      radius:acc, color:'#005eff', weight:1, fillOpacity:.06
    }).addTo(map);
  } else {
    gpsMarker.setLatLng([lat,lon]);
    accuracyCircle.setLatLng([lat,lon]).setRadius(acc);
  }

  const dist = nearestBoundaryDistance(lon,lat);
  gpsText.innerHTML =
    '<b>'+insideText(lon,lat)+'</b><br>'+
    'GPS: '+lat.toFixed(6)+', '+lon.toFixed(6)+'<br>'+
    'Точность: ±'+Math.round(acc)+' м<br>'+
    'До ближайшей границы: '+(dist<1000 ? Math.round(dist)+' м' : (dist/1000).toFixed(2)+' км');

  if (firstFix) {
    map.setView([lat,lon], Math.max(map.getZoom(), 15));
    firstFix = false;
  }
}

function onLocationError(err) {
  gpsText.innerHTML =
    '<b>Не удалось получить геопозицию.</b><br>'+
    'Разрешите доступ к местоположению. Для GPS страница должна быть открыта через HTTPS.';
  btn.classList.remove('active');
}

btn.addEventListener('click', () => {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    btn.classList.remove('active');
    gpsText.innerHTML = 'GPS остановлен. Нажмите ◎, чтобы включить снова.';
    return;
  }
  if (!navigator.geolocation) {
    onLocationError({});
    return;
  }
  btn.classList.add('active');
  gpsText.innerHTML = 'Получаю координаты…';
  watchId = navigator.geolocation.watchPosition(
    onLocation, onLocationError,
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000}
  );
});
